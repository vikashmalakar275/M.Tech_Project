[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitwatch"
version = "1.0.0"
description = "Reproducible spacecraft telemetry detection and evidence-grounded investigation."
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "torch==2.6.0",
  "streamlit==1.45.1",
  "plotly==6.1.2",
  "mcp==1.26.0",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "reportlab==4.4.2",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.13"]
browser = ["playwright==1.55.0"]

[project.scripts]
orbitwatch = "orbitwatch.cli:main"
orbitwatch-mcp = "orbitwatch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
