name: Offline quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          python -m ruff check src app.py tests scripts
          python -m ruff format --check src app.py tests scripts
      - name: Regression and integration tests
        run: python -m pytest -q
